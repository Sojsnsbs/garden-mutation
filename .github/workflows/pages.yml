name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build v1 static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html v1.css data.js engine.js main.js render.js dist/
          cp -R pelican dist/pelican
          printf '1.0.0-alpha\n' > dist/VERSION
          node --check dist/data.js
          node --check dist/engine.js
          node --check dist/main.js
          node --check dist/render.js
          grep -q 'v1.css' dist/index.html
          grep -q 'data.js' dist/index.html
          grep -q 'engine.js' dist/index.html
          grep -q 'main.js' dist/index.html
          grep -q 'render.js' dist/index.html
          ! grep -q 'DecompressionStream' dist/index.html
          ! grep -q 'fetch(' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
